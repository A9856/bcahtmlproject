<!-- grid  -->
<!DOCTYPE html>
<html>

<head>
    <title>Image Gallery</title>

    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            width: 100%;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            border: 2px solid black;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <div class="gallery">
        <img src="image/AI.jpg">
        <img src="image/code1.webp">
        <img src="image/web.jpg">
        <img src="image/code.avif">
        <img src="image/AI.jpg">
        <img src="image/code1.webp">
        <img src="image/web.jpg">
        <img src="image/code.avif">
        <img src="file:///C:/Users/GLA%20IT%20SOLUTIONS/Pictures/AIconding4.webp">
    </div>

</body>

</html>
