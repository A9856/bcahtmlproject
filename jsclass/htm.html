<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JS Button Example</title>
</head>
<body>

  <h2 class="js">Original Heading</h2>
  <button onclick="changeText()">Click Me</button>

  <script>
    function changeText() {
      document.getElementByClass("js").innerHTML = "Javascript First Implementation Code";
    }
  </script>

</body>
</html>
