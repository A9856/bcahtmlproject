<!-- # Complete Async/Await + Fetch API Demo -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Fetch API Demo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        header p {
            color: #cbd5e1;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .control-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
            text-align: center;
        }

        button {
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            background: #f8fafc;
            padding: 15px;
        }

        .card-content {
            padding: 18px;
        }

        .card h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .description {
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .category {
            display: inline-block;
            background: #e0e7ff;
            color: #3730a3;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }
    </style>
</head>

<body>

    <header>
        <h1>JavaScript Fetch API</h1>
        <p>Async / Await + API + JSON + Dynamic UI</p>
    </header>


    <div class="container">

        <div class="control-box">

            <h2>Products From API</h2>

            <p style="margin: 10px 0;">
                Data is fetched using
                <b>fetch() + async/await</b>
            </p>

            <button onclick="getData()">
                Load Products
            </button>

            <div id="status"></div>

        </div>


        <div id="products" class="products">
            
        </div>

    </div>


    <footer>
        JavaScript Fetch API Demo
    </footer>


    <script>

        /*
            =========================================
            1. ASYNC FUNCTION
            =========================================
        */

        async function getData() {

            /*
                API URL
            */

            const url = "https://dummyjson.com/products";


            /*
                Status message
            */

            const status = document.getElementById("status");

            const productsContainer =
                document.getElementById("products");


            status.innerHTML = "Loading data...";

            productsContainer.innerHTML = "";


            /*
                =========================================
                2. TRY BLOCK
                =========================================
            */

            try {

                /*
                    FETCH API

                    Server ko request bhej raha hai.
                */

                const response = await fetch(url);


                /*
                    =========================================
                    3. RESPONSE CHECK
                    =========================================
                */

                if (!response.ok) {

                    throw new Error(
                        `Response status: ${response.status}`
                    );

                }


                /*
                    =========================================
                    4. JSON DATA
                    =========================================

                    API response ko JSON mein convert
                    kar rahe hain.
                */

                const result = await response.json();


                /*
                    Console mein complete result
                */

                console.log(result);


                /*
                    Success message
                */

                status.innerHTML =
                    `Successfully loaded ${result.products.length} products.`;


                /*
                    =========================================
                    5. PARTICULAR DATA UI MEIN DISPLAY
                    =========================================
                */

                result.products.forEach(function(product) {

                    const card =
                        document.createElement("div");

                    card.className = "card";


                    card.innerHTML = `

                        <img
                            src="${product.thumbnail}"
                            alt="${product.title}"
                        >

                        <div class="card-content">

                            <h3>
                                ${product.title}
                            </h3>

                            <p class="description">
                                ${product.description}
                            </p>

                            <p class="price">
                                $${product.price}
                            </p>

                            <span class="category">
                                ${product.category}
                            </span>

                        </div>

                    `;


                    productsContainer.appendChild(card);

                });

            }


            /*
                =========================================
                6. CATCH BLOCK
                =========================================
            */

            catch (error) {

                console.error(error.message);


                status.innerHTML = `
                    <div class="error">
                        Error: ${error.message}
                    </div>
                `;

            }

        }

    </script>

</body>
</html>
