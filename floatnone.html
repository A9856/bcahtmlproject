<!DOCTYPE html>
<html>

<head>

    <title>Float None</title>

    <style>

        .box {
            width: 200px;
            height: 150px;

            background: orange;

            float: none;

            padding: 20px;
        }

    </style>

</head>

<body>

    <h1>Float None Example</h1>

    <div class="box">
        FLOAT NONE
    </div>

    <p>
        This paragraph appears below the box
        because the box is not floating.
    </p>

</body>

</html>
